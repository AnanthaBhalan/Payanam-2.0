name: payanam

services:
  # ------------------------------------------------------------------ graph
  memgraph:
    image: memgraph/memgraph-platform:latest
    container_name: payanam-memgraph
    environment:
      MEMGRAPH_GRAPHIST_AUTH_MODE: none
      # State-wide transit dataset, not just a toy graph.
      MEMGRAPH_GRAPHIST_MODE: --query-modules-enabled=true
    ports:
      - "5432:5432"   # Bolt protocol  (neo4j driver)
      - "3000:3000"   # Lab          (Dev UI)
      - "9090:9090"   # Metrics
    volumes:
      - memgraph_data:/var/lib/memgraph
      - memgraph_log:/var/log/memgraph
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | cypher-shell || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # -------------------------------------------------------------- event bus
  redpanda:
    image: redpandadata/redpanda:v24.2.13
    container_name: payanam-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
    ports:
      - "9092:9092"   # PLAINTEXT brokers (host clients)
      - "9644:9644"   # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --brokers=localhost:9092 | grep -q 'Healthy.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Create the topics the ingestion worker subscribes to.
  redpanda-init:
    image: redpandadata/redpanda:v24.2.13
    container_name: payanam-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        rpk topic create traffic_updates   --brokers=redpanda:9092 --partitions 3 --replicas 1
        rpk topic create booking_events   --brokers=redpanda:9092 --partitions 3 --replicas 1
        rpk topic create itinerary_results --brokers=redpanda:9092 --partitions 3 --replicas 1
        rpk topic list --brokers=redpanda:9092

  # ----------------------------------------------------------- orchestration
  temporal:
    image: temporalio/auto-setup:1.26.2
    container_name: payanam-temporal
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"   # gRPC
    volumes:
      - temporal_data:/var/lib/postgresql/data

  postgresql:
    image: postgres:16
    container_name: payanam-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_DB: temporal
    ports:
      - "5432:5432"
    volumes:
      - temporal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 12

  temporal-admin-tools:
    image: temporalio/admin-tools:1.26.2
    container_name: payanam-temporal-init
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until temporal operator cluster health --address temporal:7233 2>/dev/null | grep -q SERVING; do
          echo "waiting for temporal..."; sleep 2;
        done
        temporal operator namespace list --address temporal:7233
        temporal workflow list --address temporal:7233 || true
        echo "temporal is ready"

  temporal-ui:
    image: temporalio/ui:2.30.0
    container_name: payanam-temporal-ui
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8233:8080"   # Web UI  -> http://localhost:8233

  # ------------------------------------------------------ fleet geospatial
  redis:
    image: redis:7.4-alpine
    container_name: payanam-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------- api
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payanam-api
    depends_on:
      memgraph:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      APP_ENV: docker
      MEMGRAPH_URI: bolt://memgraph:7687
      MEMGRAPH_USER: ""
      MEMGRAPH_PASSWORD: ""
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_TOPIC_TRAFFIC: traffic_updates
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: payanam
      TEMPORAL_TASK_QUEUE: payanam-routing
      RAY_ADDRESS: ray://ray-head:6379
      RAY_NUM_CPUS: "2"
    ports:
      - "8000:8000"
    # Seed the Tamil Nadu topology, run the worker + stream, then serve.
    command: >
      sh -c "python -m app.graph.seed_tn || true
             python -m app.worker &
             python -m app.ingestion.stream &
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------- compute grid
  ray-head:
    image: rayproject/ray:2.40.0-py311
    container_name: payanam-ray-head
    command: >
      /bin/bash -lc "ray start --head --port=6379 --dashboard-host=0.0.0.0
      --dashboard-port=8265 --num-cpus=2 --block"
    ports:
      - "6379:6379"   # GCS (ray://)
      - "8265:8265"   # Dashboard
      - "10001:10001" # Job submission

  ray-worker:
    image: rayproject/ray:2.40.0-py311
    container_name: payanam-ray-worker
    command: >
      /bin/bash -lc "ray start --address=head:6379 --num-cpus=2 --block"
    depends_on:
      - ray-head

volumes:
  memgraph_data:
  memgraph_log:
  redis_data:
  redpanda_data:
  temporal_data:
  temporal_pgdata:
