name: payanam

services:
  # ------------------------------------------------------------------ graph
  memgraph:
    image: memgraph/memgraph-platform:latest
    container_name: payanam-memgraph
    environment:
      MEMGRAPH_GRAPHIST_AUTH_MODE: none
      # State-wide transit dataset, not just a toy graph.
      MEMGRAPH_GRAPHIST_MODE: --query-modules-enabled=true
    ports:
      # NOTE: Bolt is 7687. The old mapping exposed 5432 (PostgreSQL's port)
      # while labelling it "Bolt", so the API could never reach the graph.
      - "${MEMGRAPH_BOLT_HOST_PORT:-7687}:7687"     # Bolt  (neo4j driver)
      - "${MEMGRAPH_LAB_HOST_PORT:-3000}:3000"       # Lab   (Dev UI)
      - "${MEMGRAPH_METRICS_HOST_PORT:-9090}:9090"   # Metrics
    volumes:
      - memgraph_data:/var/lib/memgraph
      - memgraph_log:/var/log/memgraph
    healthcheck:
      # cypher-shell is absent from memgraph/memgraph-platform, so the original
      # probe could never pass. Probe the Bolt port directly -- but /dev/tcp is a
      # *bash* extension and CMD-SHELL runs /bin/sh (dash), so bash is invoked
      # explicitly.
      test:
        - CMD-SHELL
        - "bash -c '(echo > /dev/tcp/127.0.0.1/7687)' >/dev/null 2>&1 || exit 1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # -------------------------------------------------------------- event bus
  redpanda:
    image: redpandadata/redpanda:v24.2.13
    container_name: payanam-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      # Without an explicit advertised address Redpanda advertises 127.0.0.1,
      # so every client connects once and then is redirected to its own
      # loopback. That is the real cause of the old librdkafka "Failed to
      # resolve redpanda" error -- not a DNS problem at all.
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "${REDPANDA_KAFKA_HOST_PORT:-9092}:9092"   # PLAINTEXT brokers
      - "${REDPANDA_ADMIN_HOST_PORT:-9644}:9644"   # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      # `rpk cluster health` is a cluster-level command and rejects --brokers;
      # `rpk cluster info --brokers=...` is the per-endpoint probe that works.
      test:
        - CMD-SHELL
        - "rpk cluster info --brokers=localhost:9092 >/dev/null 2>&1 || exit 1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Create the topics the ingestion worker subscribes to.
  redpanda-init:
    image: redpandadata/redpanda:v24.2.13
    container_name: payanam-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        rpk topic create traffic_updates   --brokers=redpanda:9092 --partitions 3 --replicas 1
        rpk topic create booking_events   --brokers=redpanda:9092 --partitions 3 --replicas 1
        rpk topic create itinerary_results --brokers=redpanda:9092 --partitions 3 --replicas 1
        rpk topic list --brokers=redpanda:9092

  # ----------------------------------------------------------- orchestration
  temporal:
    image: temporalio/auto-setup:1.26.2
    container_name: payanam-temporal
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
      # DYNAMIC_CONFIG_FILE_PATH pointed at
      # config/dynamicconfig/development-sql.yaml, which does not exist in this
      # image ("Unable to create dynamic config client ... no such file").
      # The image's built-in default is correct for local dev.
    ports:
      - "${TEMPORAL_GRPC_HOST_PORT:-7233}:7233"   # gRPC
    volumes:
      - temporal_data:/var/lib/postgresql/data

  postgresql:
    image: postgres:16
    container_name: payanam-postgres
    environment:
      POSTGRES_USER: temporal
      # The image requires POSTGRES_PASSWORD to initialise; POSTGRES_PWD is
      # what the Temporal *server* uses when connecting. Setting only
      # POSTGRES_PWD makes the container exit(1) with "Database is
      # uninitialized and superuser password is not specified".
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-temporal}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-temporal}
      POSTGRES_DB: temporal
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - temporal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 12

  temporal-admin-tools:
    image: temporalio/admin-tools:1.26.2
    container_name: payanam-temporal-init
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until temporal operator cluster health --address temporal:7233 2>/dev/null | grep -q SERVING; do
          echo "waiting for temporal..."; sleep 2;
        done
        temporal operator namespace list --address temporal:7233
        temporal workflow list --address temporal:7233 || true
        echo "temporal is ready"

  temporal-ui:
    image: temporalio/ui:2.30.0
    container_name: payanam-temporal-ui
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "${TEMPORAL_UI_HOST_PORT:-8233}:8080"   # Web UI

  # ------------------------------------------------------------- chaos harness
  # Runs INSIDE the compose network: Redpanda advertises itself as
  # `redpanda:9092`, a name resolvable only on the Docker network. A host-side
  # client can open localhost:9095 but then cannot follow the advertised
  # metadata, so the harness must run in-network. Same image as the API.
  chaos:
    profiles: ["chaos"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payanam-chaos
    depends_on:
      api:
        condition: service_healthy
    environment:
      PAYANAM_API: http://api:8000
      PAYANAM_KAFKA: redpanda:9092
      PAYANAM_TOPIC: traffic_updates
      # Deterministic fleet baseline the run must return to intact.
      PAYANAM_FLEET_SIZE: "${PAYANAM_FLEET_SIZE:-60}"
    command: >
      python scripts/chaos_monkey.py
      --tourists ${CHAOS_TOURISTS:-50}
      --sabotage-rate ${CHAOS_SABOTAGE_RATE:-0.3}
      --timeout ${CHAOS_TIMEOUT:-60}

  # ------------------------------------------------------ fleet geospatial
  redis:
    image: redis:7.4-alpine
    container_name: payanam-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - ""
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------- api
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payanam-api
    depends_on:
      memgraph:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      APP_ENV: docker
      MEMGRAPH_URI: bolt://memgraph:7687
      MEMGRAPH_USER: ""
      MEMGRAPH_PASSWORD: ""
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_TOPIC_TRAFFIC: traffic_updates
      REDIS_URL: redis://redis:6379/0
      # Phase 11: deterministic chaos baselines. Pins every graph edge's
      # confirmation probability to 1.0 so only injected sabotage causes
      # drops (see app/graph/seed_tn.py). Set PAYANAM_TEST_MODE=0 for
      # organic-risk demos.
      PAYANAM_TEST_MODE: "${PAYANAM_TEST_MODE:-1}"
      # Window before the FIRST booking during which a transit_update signal
      # can still amend the plan. Without it the workflow books all legs in a
      # few milliseconds and no disruption can ever land -- the Saga would be
      # unreachable in practice. The chaos harness depends on this being > 0.
      REPLAN_GRACE_SECONDS: ${REPLAN_GRACE_SECONDS:-10}
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: payanam
      TEMPORAL_TASK_QUEUE: payanam-routing
      RAY_ADDRESS: ${RAY_ADDRESS:-ray://ray-head:10001}
      RAY_NUM_CPUS: "2"
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    # Seed the TN topology, run the worker, then serve.
    #
    # NOTE: exactly ONE Kafka consumer runs -- the FastAPI lifespan's. An
    # earlier standalone `python -m app.ingestion.stream` shared the consumer
    # group but had no Temporal client, so every traffic_update it received
    # was dropped with "temporal client not initialised" (Phase 11: sabotaged
    # workflows whose signal never reached the workflow broke parity).
    command: >
      sh -c "python -m app.graph.seed_tn || true
             python -m app.worker &
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------- compute grid
  ray-head:
    build:
      context: .
      dockerfile: Dockerfile.ray
    image: payanam-ray:2.40.0
    container_name: payanam-ray-head
    # --ray-client-server-port binds the Ray *Client* endpoint (10001). Ray
    # Client talks to this port; 6379 is the GCS port used by workers to join.
    # --node-ip-address advertises the compose DNS name so the client receives a
    # routable address instead of the container's internal/loopback IP.
    command: >
      /bin/bash -lc "ray start --head --port=6379
      --ray-client-server-port=10001
      --node-ip-address=ray-head
      --dashboard-host=0.0.0.0 --dashboard-port=8265
      --num-cpus=2 --block"
    ports:
      - "${RAY_GCS_HOST_PORT:-6380}:6379"          # GCS (worker join)
      - "${RAY_DASHBOARD_HOST_PORT:-8265}:8265"    # Dashboard
      - "${RAY_CLIENT_HOST_PORT:-10001}:10001"     # Ray Client (ray://)
    healthcheck:
      test:
        - CMD-SHELL
        - "ray status >/dev/null 2>&1 || exit 1"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  ray-worker:
    build:
      context: .
      dockerfile: Dockerfile.ray
    image: payanam-ray:2.40.0
    container_name: payanam-ray-worker
    # Joins via the GCS port (6379), advertising its own DNS name.
    command: >
      /bin/bash -lc "ray start --address=ray-head:6379
      --node-ip-address=ray-worker --num-cpus=2 --block"
    depends_on:
      ray-head:
        condition: service_healthy

volumes:
  memgraph_data:
  memgraph_log:
  redis_data:
  redpanda_data:
  temporal_data:
  temporal_pgdata:
